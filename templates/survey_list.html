<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Surveys</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --primary-color: #60BA81;
            --primary-dark: #4e9d6d;
            --secondary-color: #284952;
            --background-color: #F5F5F5;
            --card-background: #FFFFFF;
            --text-color: #333333;
            --text-light: #666666;
            --text-lighter: #888888;
            --status-not-filled: #f5a83c;
            --status-filled: #4CAF50;
            --status-draft: #808080;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: var(--primary-color);
            color: var(--card-background);
            padding: 30px 20px;
            border-radius: 0 0 30px 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            font-weight: bold;
        }

        .survey-list {
            display: grid;
            gap: 25px;
        }

        .survey-card {
            background-color: var(--card-background);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 5px solid var(--primary-color);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .survey-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .survey-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--secondary-color);
        }

        .survey-description {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .survey-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            background-color: var(--background-color);
            border-radius: 8px;
            padding: 10px;
        }

        .info-item {
            display: flex;
            align-items: center;
        }

        .info-icon {
            margin-right: 8px;
            color: var(--primary-color);
        }

        .info-label {
            font-size: 14px;
            color: var(--text-lighter);
            margin-right: 4px;
        }

        .info-value {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .survey-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--background-color);
        }

        .expiry-date {
            font-size: 14px;
            color: var(--text-lighter);
        }

        .survey-status {
            font-size: 14px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
        }

        .status-not-filled { 
            color: var(--status-not-filled);
            background-color: rgba(245, 168, 60, 0.1);
        }
        .status-filled { 
            color: var(--status-filled);
            background-color: rgba(76, 175, 80, 0.1);
        }
        .status-draft { 
            color: var(--status-draft);
            background-color: rgba(128, 128, 128, 0.1);
        }

        .loading, .error, .no-surveys {
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--primary-color);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: #FF0000;
        }

        .no-surveys-card {
            background-color: var(--card-background);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 16px auto;
            max-width: 400px;
            text-align: center;
        }

        .no-surveys-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--secondary-color);
        }

        .no-surveys-subtext {
            font-size: 16px;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Available Surveys</h1>
        </header>
        <main id="main-content">
            <!-- Content will be dynamically inserted here -->
        </main>
    </div>

    <script>
        const mainContent = document.getElementById('main-content');
        const employeeId = {{ employee_id }};

        function createSurveyCard(survey) {
            return `
                <div class="survey-card" data-id="${survey.id}">
                    <h2 class="survey-title">${survey.title}</h2>
                    <p class="survey-description">${survey.description}</p>
                    <div class="survey-info">
                        <div class="info-item">
                            <i class="fas fa-question-circle info-icon"></i>
                            <span class="info-label">Questions:</span>
                            <span class="info-value">${survey.question_count}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-clock info-icon"></i>
                            <span class="info-label">Est. Time:</span>
                            <span class="info-value">${survey.estimated_time} min</span>
                        </div>
                    </div>
                    <div class="survey-footer">
                        <span class="expiry-date"><i class="fas fa-calendar-alt"></i> Expires: ${survey.expiry_date}</span>
                        <span class="survey-status status-${survey.status.toLowerCase().replace(' ', '-')}">${survey.status}</span>
                    </div>
                </div>
            `;
        }

        function showLoading() {
            mainContent.innerHTML = '<div class="loading">Loading surveys...</div>';
        }

        function showError(message) {
            mainContent.innerHTML = `<div class="error">${message}</div>`;
        }

        function showNoSurveys() {
            mainContent.innerHTML = `
                <div class="no-surveys-card">
                    <h2 class="no-surveys-text">No surveys found</h2>
                    <p class="no-surveys-subtext">Check back later for new surveys</p>
                </div>
            `;
        }

        function showSurveys(surveys) {
            mainContent.innerHTML = `
                <div class="survey-list">
                    ${surveys.map(createSurveyCard).join('')}
                </div>
            `;

            document.querySelectorAll('.survey-card').forEach(card => {
                card.addEventListener('click', () => {
                    const surveyId = card.dataset.id;
                    const status = card.querySelector('.survey-status').textContent;
                    if (status !== 'Filled') {
                        window.location.href = `/login/survey_questions_form?surveyId=${surveyId}&employeeId=${employeeId}`;
                    }
                });
            });
        }

        async function fetchSurveys() {
            showLoading();
            try {
                const response = await fetch(`https://fruitofsustainability.com/app_api/restful_api.php?route=surveys&employee_id=${employeeId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch surveys');
                }
                const surveys = await response.json();
                if (surveys.length === 0) {
                    showNoSurveys();
                } else {
                    showSurveys(surveys);
                }
            } catch (error) {
                showError('Error: ' + error.message);
            }
        }

        fetchSurveys();
    </script>
</body>
</html>
