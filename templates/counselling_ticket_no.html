<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOS-Counseling Session Confirmation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/png" />
    <style>
        :root {
            --primary-color: #206E71;
            --secondary-color: #60BA81;
            --accent-color: #F5A83C;
            --dark-color: #284952;
            --light-color: #f8f9fa;
            --success-color: #28a745;
            --border-radius: 10px;
            --box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f8fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .confirmation-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            margin: 20px;
        }
        
        .card-header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .card-body {
            padding: 40px 30px;
            text-align: center;
        }
        
        .success-icon {
            width: 90px;
            height: 90px;
            background-color: var(--success-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            color: white;
            font-size: 40px;
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }
        
        .ticket-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark-color);
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px dashed #ddd;
        }
        
        .confirmation-message {
            margin-bottom: 30px;
            color: #555;
            font-size: 16px;
        }
        
        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 500;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 5px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: #185658;
            border-color: #185658;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        .btn-secondary:hover {
            background-color: #e09730;
            border-color: #e09730;
            transform: translateY(-2px);
        }
        
        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-outline-primary:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }
        
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        @media print {
            .no-print {
                display: none;
            }
            
            body {
                background-color: white;
            }
            
            .confirmation-card {
                box-shadow: none;
                margin: 0;
                width: 100%;
            }
        }
        
        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        .delay-1 {
            animation-delay: 0.1s;
        }
        
        .delay-2 {
            animation-delay: 0.3s;
        }
        
        .delay-3 {
            animation-delay: 0.5s;
        }
    </style>
</head>

<body>
    <div class="confirmation-card animate-fade-in">
        <div class="card-header">
            <h2 class="mb-0">Counseling Session Confirmation</h2>
        </div>
        <div class="card-body">
            <div class="success-icon animate-fade-in delay-1">
                <i class="fas fa-check"></i>
            </div>
            
            <h3 class="animate-fade-in delay-1">Success!</h3>
            
            <div class="ticket-number animate-fade-in delay-2">
                {{ ticket_number|safe }}
            </div>
            
            <p class="confirmation-message animate-fade-in delay-2">
                Your counseling session has been successfully registered. Please keep this ticket number for your reference.
            </p>
            
            <div class="action-buttons animate-fade-in delay-3 no-print">
                <a href="{{ url_for('counseling_form') }}" class="btn btn-primary">
                    <i class="fas fa-plus-circle"></i> New Session
                </a>
                <a href="{{ url_for('cs_dashboard') }}" class="btn btn-secondary">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <button onclick="window.print()" class="btn btn-outline-primary">
                    <i class="fas fa-print"></i> Print
                </button>
            </div>
        </div>
    </div>
</body>

</html>
