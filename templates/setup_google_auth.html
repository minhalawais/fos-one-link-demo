<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="author" content="FOS">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/png" />
    <title>FOS - Setup Google Authenticator</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='my-login.css') }}">
    <style>
        .my-login-page .brand {
            width: 110px;
            height: 110px;
        }
        .qr-code-container {
            text-align: center;
            margin: 20px 0;
        }
        .manual-secret {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            word-break: break-all;
        }
    </style>
</head>
<body class="my-login-page">
    <section class="h-100">
        <div class="container h-100">
            <div class="row justify-content-md-center h-100">
                <div class="card-wrapper">
                    <div class="brand">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="logo">
                    </div>
                    <div class="card fat">
                        <div class="card-body">
                            <h4 class="card-title">Setup Google Authenticator</h4>
                            <p>Scan the QR code below with the Google Authenticator app:</p>
                            
                            <div class="qr-code-container">
                                <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code">
                            </div>
                            
                            <p>Or enter this secret key manually:</p>
                            <div class="manual-secret">
                                {{ secret }}
                            </div>
                            
                            <p>After setting up, you'll be asked to verify a code.</p>
                            
                            <div class="form-group m-0">
                                <a href="{{ url_for('verify_google_auth') }}" class="btn btn-primary btn-block">
                                    Continue to Verification
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="footer">
                        Copyright &copy; 2023 &mdash; Fruit of Sustainability
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
