            .timeline {
                position: relative;
                padding: 10px;
                margin: 0 auto;
                overflow: hidden;
                color: #ffffff;
            }

            .timeline:after {
                content: "";
                position: absolute;
                top: 0;
                left: 50%;
                margin-left: -1px;
                border-right: 2px dashed #c4d2e2;
                height: 100%;
                display: block;
            }

            .timeline-row {
                padding-left: 50%;
                position: relative;
                margin-bottom: 30px;
            }

            .timeline-row .timeline-time {
                position: absolute;
                right: 50%;
                top: 16px;
                text-align: right;
                margin-right: 20px;
                color: #000000;
                font-size: 1.5rem;
            }

            .timeline-row .timeline-time small {
                display: block;
                font-size: 0.8rem;
                color: #8796af;
            }

            .timeline-row .timeline-content {
                position: relative;
                padding: 20px 30px;
                -webkit-border-radius: 10px;
                -moz-border-radius: 10px;
                border-radius: 10px;
            }

            .timeline-row .timeline-content:after {
                content: "";
                position: absolute;
                top: 20px;
                height: 3px;
                width: 40px;
            }

            .timeline-row .timeline-content:before {
                content: "";
                position: absolute;
                top: 20px;
                right: -50px;
                width: 20px;
                height: 20px;
                -webkit-border-radius: 100px;
                -moz-border-radius: 100px;
                border-radius: 100px;
                z-index: 100;
                background: #ffffff;
                border: 2px dashed #c4d2e2;
            }

            .timeline-row .timeline-content h4 {
                margin: 0 0 1px 0;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
                line-height: 150%;
            }

            .timeline-row .timeline-content p {
                margin-bottom: 1px;
                line-height: 150%;
            }

            .timeline-row .timeline-content i {
                font-size: 2rem;
                color: #ffffff;
                line-height: 100%;
                padding: 10px;
                border: 2px solid #ffffff;
                -webkit-border-radius: 100px;
                -moz-border-radius: 100px;
                border-radius: 100px;
                margin-bottom: 10px;
                display: inline-block;
            }

            .timeline-row .timeline-content .thumbs {
                margin-bottom: 20px;
            }

            .timeline-row .timeline-content .thumbs img {
                margin-bottom: 10px;
            }

            .timeline-row:nth-child(even) .timeline-content {
                background-color: #ff5000;
                /* Fallback Color */
                background-image: -webkit-gradient(linear, left top, left bottom, from(#fc6d4c), to(#ff5000));
                /* Saf4+, Chrome */
                background-image: -webkit-linear-gradient(top, #fc6d4c, #ff5000);
                /* Chrome 10+, Saf5.1+, iOS 5+ */
                background-image: -moz-linear-gradient(top, #fc6d4c, #ff5000);
                /* FF3.6 */
                background-image: -ms-linear-gradient(top, #fc6d4c, #ff5000);
                /* IE10 */
                background-image: -o-linear-gradient(top, #fc6d4c, #ff5000);
                /* Opera 11.10+ */
                background-image: linear-gradient(top, #fc6d4c, #ff5000);
                margin-left: 40px;
                text-align: left;
            }

            .timeline-row:nth-child(even) .timeline-content:after {
                left: -39px;
                border-right: 18px solid #ff5000;
                border-top: 10px solid transparent;
                border-bottom: 10px solid transparent;
            }

            .timeline-row:nth-child(even) .timeline-content:before {
                left: -50px;
                right: initial;
            }

            .timeline-row:nth-child(odd) {
                padding-left: 0;
                padding-right: 50%;
            }

            .timeline-row:nth-child(odd) .timeline-time {
                right: auto;
                left: 50%;
                text-align: left;
                margin-right: 0;
                margin-left: 20px;
            }

            .timeline-row:nth-child(odd) .timeline-content {
                background-color: #5a99ee;
                /* Fallback Color */
                background-image: -webkit-gradient(linear, left top, left bottom, from(#1379bb), to(#5a99ee));
                /* Saf4+, Chrome */
                background-image: -webkit-linear-gradient(top, #1379bb, #5a99ee);
                /* Chrome 10+, Saf5.1+, iOS 5+ */
                background-image: -moz-linear-gradient(top, #1379bb, #5a99ee);
                /* FF3.6 */
                background-image: -ms-linear-gradient(top, #1379bb, #5a99ee);
                /* IE10 */
                background-image: -o-linear-gradient(top, #1379bb, #5a99ee);
                /* Opera 11.10+ */
                background-image: linear-gradient(top, #1379bb, #5a99ee);
                margin-right: 40px;
                margin-left: 0;
                text-align: right;
            }

            .timeline-row:nth-child(odd) .timeline-content:after {
                right: -39px;
                border-left: 18px solid #1379bb;
                border-top: 10px solid transparent;
                border-bottom: 10px solid transparent;
            }

    <script>
        var data = {{ data | tojson }};
        const complaintList = document.getElementById('complaintList');
        const searchBar = document.getElementById('searchBar');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const enableSelectedBtn = document.getElementById('enableSelectedBtn');
        const disableSelectedBtn = document.getElementById('disableSelectedBtn');
        const modal = document.getElementById('confirmModal');
        const modalMessage = document.getElementById('modalMessage');
        const confirmYes = document.getElementById('confirmYes');
        const confirmNo = document.getElementById('confirmNo');
    
        function createComplaintItem(complaint) {
            const li = document.createElement('li');
            li.className = 'complaint-item';
            li.innerHTML = `
                <input type="checkbox" class="complaint-checkbox">
                <div class="complaint-content">
                    <div class="complaint-ticket" onclick="openSubModal('${complaint.ticket_number}')">${complaint.ticket_number}</div>
                    <div class="complaint-text">${complaint.complaint_categories}</div>
                </div>
                <button class="btn toggle-btn">${complaint.enabled ? 'Disable' : 'Enable'}</button>
            `;
            if (!complaint.enabled) {
                li.classList.add('disabled');
            }
            return li;
        }
    
        function renderComplaints(complaintsToRender) {
            complaintList.innerHTML = '';
            complaintsToRender.forEach(complaint => {
                complaintList.appendChild(createComplaintItem(complaint));
            });
        }
    
        renderComplaints(data);
    
        searchBar.addEventListener('input', (e) => {
            const searchString = e.target.value.trim().toLowerCase();
            const filteredComplaints = data.filter(complaint =>
                (complaint.complaint_categories && complaint.complaint_categories.toLowerCase().includes(searchString)) ||
                (complaint.ticket_number && complaint.ticket_number.toLowerCase().includes(searchString))
            );
            renderComplaints(filteredComplaints);
        });
        function showConfirmation(message, callback) {
            modalMessage.textContent = message;
            modal.style.display = "block";
            confirmYes.onclick = () => {
                modal.style.display = "none";
                callback(true);
            };
            confirmNo.onclick = () => {
                modal.style.display = "none";
                callback(false);
            };
        }
    
        function toggleComplaint(complaint, action) {
            return fetch("{{ url_for('toggle_complaint') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    ticket_number: complaint.ticket_number,
                    action: action
                }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    complaint.enabled = (action === 'enable');
                    return true;
                } else {
                    alert('Failed to ' + action + ' complaint: ' + data.message);
                    return false;
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('An error occurred while trying to ' + action + ' the complaint');
                return false;
            });
        }
    
        complaintList.addEventListener('click', (e) => {
            if (e.target.classList.contains('toggle-btn')) {
                const listItem = e.target.closest('.complaint-item');
                const index = Array.from(complaintList.children).indexOf(listItem);
                const complaint = data[index];
                const action = complaint.enabled ? 'disable' : 'enable';
                showConfirmation(`Are you sure you want to ${action} this complaint?`, (confirmed) => {
                    if (confirmed) {
                        toggleComplaint(complaint, action).then(success => {
                            if (success) {
                                listItem.classList.toggle('disabled');
                                e.target.textContent = complaint.enabled ? 'Disable' : 'Enable';
                            }
                        });
                    }
                });
            }
        });
    
        selectAllBtn.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.complaint-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            selectAllBtn.textContent = allChecked ? 'Select All' : 'Deselect All';
        });
    
        function handleBulkAction(action) {
            const selectedItems = document.querySelectorAll('.complaint-checkbox:checked');
            if (selectedItems.length === 0) {
                alert('Please select at least one complaint.');
                return;
            }
            showConfirmation(`Are you sure you want to ${action} ${selectedItems.length} complaint(s)?`, (confirmed) => {
                if (confirmed) {
                    const promises = Array.from(selectedItems).map(item => {
                        const listItem = item.closest('.complaint-item');
                        const index = Array.from(complaintList.children).indexOf(listItem);
                        const complaint = data[index];
                        return toggleComplaint(complaint, action).then(success => {
                            if (success) {
                                const toggleBtn = listItem.querySelector('.toggle-btn');
                                if (action === 'enable') {
                                    listItem.classList.remove('disabled');
                                    toggleBtn.textContent = 'Disable';
                                } else {
                                    listItem.classList.add('disabled');
                                    toggleBtn.textContent = 'Enable';
                                }
                            }
                            return success;
                        });
                    });
    
                    Promise.all(promises).then(results => {
                        const successCount = results.filter(Boolean).length;
                        alert(`Successfully ${action}d ${successCount} out of ${selectedItems.length} complaints.`);
                        selectedItems.forEach(item => item.checked = false);
                    });
                }
            });
        }
    
        enableSelectedBtn.addEventListener('click', () => handleBulkAction('enable'));
        disableSelectedBtn.addEventListener('click', () => handleBulkAction('disable'));
    </script>
